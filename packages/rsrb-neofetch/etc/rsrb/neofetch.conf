# RSRB neofetch preset – only overrides; everything else keeps neofetch's defaults.
# Personal tweaks: copy this file to ~/.config/neofetch/config.conf and edit it there.

print_info() {
    info title
    info underline
    info "OS" distro
    info "Device" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "CPU" cpu
    info "Memory" memory
    info "Volumes" disk
    info "Local IP" local_ip
    command -v rackpanel >/dev/null && prin "Web UI" "http://$(hostname -I 2>/dev/null | cut -d' ' -f1)$(sed -n 's/.*-listen :\([0-9]*\).*/:\1/p' /etc/default/rackpanel 2>/dev/null | sed 's/^:80$//')"
    info cols
}

image_source="/usr/share/rsrb/logo.txt"
ascii_colors=(86 105)
colors=(86 105 7 86 105 7)
bold="on"
underline_char="─"
separator="  "
memory_percent="on"
uptime_shorthand="tiny"
cpu_temp="C"
disk_subtitle="mount"
disk_show=(/ $(ls -d /volume[0-9]* 2>/dev/null))
